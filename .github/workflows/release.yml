name: Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "ios/**"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          xcodebuild archive \
            -project CoinBag.xcodeproj \
            -scheme CoinBag \
            -configuration Release \
            -archivePath build/CoinBag.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/CoinBag.xcarchive/Products/Applications/CoinBag.app build/Payload/
          cd build && zip -r CoinBag.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: ios/build/CoinBag.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Determine next release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^r[0-9]+$' | sed 's/^r//' | sort -n | tail -1)
          if [ -z "$latest" ]; then
            next=1
          else
            next=$((latest + 1))
          fi
          echo "tag=r${next}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            android-apk/app-release.apk \
            ios-ipa/CoinBag.ipa \
            --repo "${{ github.repository }}" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes "Automated build from commit ${{ github.sha }}"
